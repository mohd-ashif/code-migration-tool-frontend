name: Frontend CI/CD Pipeline (Vercel)

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Vite Build Check
        run: npm run build

  deploy-vercel:
    name: Deploy Frontend to Vercel Production
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link & Deploy to Vercel Production
        run: |
          mkdir -p .vercel
          echo '{"orgId":"'${{ secrets.VERCEL_ORG_ID }}'","projectId":"'${{ secrets.VERCEL_PROJECT_ID }}'"}' > .vercel/project.json
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
